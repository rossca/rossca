<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

const P = new URLSearchParams(location.search);
const shot = P.get('shot') || 'negro';
const W = +P.get('w') || 1600, H = +P.get('h') || 1600;

const RW = W * SS, RH = H * SS;
const finish = P.get('finish') || (shot.includes('dorado') ? 'dorado' : 'negro');
const V3 = THREE.Vector3;

// ---------------- fonts ----------------
const fonts = [
  ['Playfair', 'node_modules/@fontsource/playfair-display/files/playfair-display-latin-500-normal.woff2', {}],
  ['PlayfairItalic', 'node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-italic.woff2', {}],
  ['Jost', 'node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2', {}],
  ['JostLight', 'node_modules/@fontsource/jost/files/jost-latin-300-normal.woff2', {}],
];
for (const [n, u, d] of fonts) { const f = new FontFace(n, `url(${u})`, d); await f.load(); document.fonts.add(f); }

// ---------------- renderer ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(RW, RH);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +P.get('exp') || 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a08);
const pmrem = new THREE.PMREMGenerator(renderer);

// ---------------- procedural textures ----------------
function rng(seed) { let s = seed >>> 0; return () => ((s = Math.imul(s ^ (s >>> 15), 2246822519) + 0x9e3779b9 >>> 0) / 4294967296); }
function canvas(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return c; }
function tex(c, srgb = true, rep = [1, 1]) {
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.anisotropy = 16; return t;
}

// Walnut: colour, roughness and bump from one grain field.
function walnut() {
  const w = 4096, h = 1024, r = rng(42);
  const lines = []; let y = 0;
  while (y < h) { const th = 1 + r() * 7; lines.push([y, th, r()]); y += th; }
  const draw = (mode) => canvas(w, h, (g) => {
    g.fillStyle = mode === 'col' ? '#3b2416' : mode === 'rough' ? '#7a7a7a' : '#808080'; g.fillRect(0, 0, w, h);
    for (const [ly, th, k] of lines) {
      const tone = k;
      if (mode === 'col') { const c = 38 + tone * 22; g.fillStyle = `rgba(${c + 34},${c + 12},${c - 6},0.35)`; }
      else if (mode === 'rough') { const c = 100 + tone * 60; g.fillStyle = `rgb(${c},${c},${c})`; }
      else { const c = 90 + tone * 90; g.fillStyle = `rgb(${c},${c},${c})`; }
      g.beginPath(); g.moveTo(0, ly);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, ly + Math.sin(x / w * Math.PI * 6 + ly * 0.02) * 9 + Math.sin(x / w * Math.PI * 28 + k * 9) * 2);
      for (let x = w; x >= 0; x -= 32) g.lineTo(x, ly + th + Math.sin(x / w * Math.PI * 6 + ly * 0.02) * 9 + Math.sin(x / w * Math.PI * 28 + k * 9) * 2);
      g.fill();
    }
    const rr = rng(7);
    for (let i = 0; i < 26000; i++) { // pores
      const x = rr() * w, yy = rr() * h, l = 3 + rr() * 14;
      g.fillStyle = mode === 'col' ? `rgba(15,8,4,${0.25 + rr() * 0.35})` : mode === 'rough' ? 'rgba(200,200,200,0.6)' : 'rgba(30,30,30,0.7)';
      g.fillRect(x, yy, l, 1);
    }
  });
  return { map: tex(draw('col')), roughnessMap: tex(draw('rough'), false), bumpMap: tex(draw('bump'), false) };
}
const WOOD = walnut();

function brushed(seed = 3) {
  const r = rng(seed);
  return tex(canvas(1024, 1024, (g, w, h) => {
    g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 5000; i++) { const v = 90 + r() * 80 | 0; g.fillStyle = `rgba(${v},${v},${v},0.5)`; g.fillRect(0, r() * h, w, 0.6 + r()); }
  }), false, [1, 4]);
}
function speckle(seed = 5) {
  const r = rng(seed);
  return tex(canvas(1024, 1024, (g, w, h) => {
    g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 90000; i++) { const v = 100 + r() * 60 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(r() * w, r() * h, 1.5, 1.5); }
  }), false, [3, 3]);
}
const BRUSH = brushed(), SPECK = speckle();

function paperLabel(scent) {
  return tex(canvas(2048, 1024, (g, w, h) => {
    const r = rng(9);
    g.fillStyle = '#efe6d6'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 40000; i++) { g.fillStyle = `rgba(120,100,70,${r() * 0.05})`; g.fillRect(r() * w, r() * h, 1 + r() * 3, 1); }
    g.strokeStyle = '#b8924e'; g.lineWidth = 4; g.strokeRect(70, 70, w - 140, h - 140);
    g.lineWidth = 1.5; g.strokeRect(88, 88, w - 176, h - 176);
    g.fillStyle = '#17130e'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '500 210px Playfair'; g.letterSpacing = '24px'; g.fillText('VELAROMA', w / 2 + 12, h / 2 - 120);
    g.fillStyle = '#b8924e'; g.fillRect(w / 2 - 160, h / 2 + 8, 320, 3);
    g.fillStyle = '#17130e'; g.letterSpacing = '2px'; g.font = '400 112px PlayfairItalic'; g.fillText(scent, w / 2, h / 2 + 120);
    g.letterSpacing = '14px'; g.font = '400 46px Jost'; g.fillStyle = '#5a4b38'; g.fillText('VELA DE SOJA · 220 G', w / 2 + 7, h / 2 + 260);
  }));
}
function cardTex(title, sub, w = 2048, h = 1024, bg = '#0f0d0b') {
  return tex(canvas(w, h, (g) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#c9a45c'; g.lineWidth = 6; g.strokeRect(60, 60, w - 120, h - 120);
    g.fillStyle = '#d8b56c'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.letterSpacing = '10px'; g.font = `500 ${h * 0.2}px Playfair`; g.fillText(title, w / 2, h / 2 - (sub ? h * 0.08 : 0));
    if (sub) { g.letterSpacing = '14px'; g.font = `400 ${h * 0.075}px Jost`; g.fillText(sub, w / 2, h / 2 + h * 0.16); }
  }));
}
// vertical glow used to fake light penetrating the wax from above
const waxGlow = tex(canvas(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.12, '#c2c2c2'); gr.addColorStop(0.45, '#2a2a2a'); gr.addColorStop(1, '#000000');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
}));
waxGlow.wrapS = waxGlow.wrapT = THREE.ClampToEdgeWrapping;

// ---------------- materials ----------------
const MAT = {};
MAT.brass = new THREE.MeshPhysicalMaterial({ color: 0xbf9758, metalness: 1, roughness: 0.4, roughnessMap: BRUSH, anisotropy: 0.7, clearcoat: 0.15, clearcoatRoughness: 0.3 });
MAT.brassPolished = new THREE.MeshPhysicalMaterial({ color: 0xd8b26c, metalness: 1, roughness: 0.16 });
MAT.black = new THREE.MeshPhysicalMaterial({ color: 0x141312, metalness: 0.35, roughness: 0.42, bumpMap: SPECK, bumpScale: 0.25, clearcoat: 0.6, clearcoatRoughness: 0.32 });
MAT.body = finish === 'dorado' ? MAT.brass : MAT.black;

MAT.accent = finish === 'dorado' ? new THREE.MeshPhysicalMaterial({ color: 0x1a1714, metalness: 0.4, roughness: 0.4 }) : MAT.brassPolished;
MAT.shadeInner = new THREE.MeshStandardMaterial({ color: 0xf2e6cf, roughness: 0.55, side: THREE.BackSide });

MAT.glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.35, ior: 1.5, specularIntensity: 1, envMapIntensity: 1.4, attenuationColor: new THREE.Color(0xf6ead8), attenuationDistance: 40 });
MAT.wax = new THREE.MeshPhysicalMaterial({ color: 0xdccbb0, roughness: 0.62, sheen: 0.4, sheenColor: new THREE.Color(0xfff3e0), emissive: 0xff9a40, emissiveMap: waxGlow, emissiveIntensity: +(P.get('waxglow') || 0.32) });
MAT.pool = new THREE.MeshPhysicalMaterial({ color: 0xb8742e, roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, emissive: 0xa0561a, emissiveIntensity: +(P.get('poolglow') || 0.45), specularIntensity: 1, envMapIntensity: 3.5, ior: 1.47 });
MAT.meniscus = new THREE.MeshPhysicalMaterial({ color: 0xf3dfbf, roughness: 0.15, clearcoat: 1, emissive: 0xffb060, emissiveIntensity: 0.6 });
MAT.wick = new THREE.MeshStandardMaterial({ color: 0x15100b, roughness: 0.95 });
MAT.wood = new THREE.MeshPhysicalMaterial({ ...WOOD, color: 0xffffff, bumpScale: 0.6, clearcoat: 0.18, clearcoatRoughness: 0.5, envMapIntensity: 0.25 });
MAT.lens = new THREE.MeshStandardMaterial({ color: 0xfff4dd, emissive: 0xffd49a, emissiveIntensity: 7 });

function mesh(geo, mat, { cast = true, receive = true } = {}) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = receive; return m; }
const lathe = (pts, seg = 160) => new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg);

// ---------------- lamp ----------------
function buildLamp() {
  const g = new THREE.Group(); g.name = 'lamp';
  // base with bevel and shallow tray
  g.add(mesh(lathe([[0, 0], [9.15, 0], [9.45, 0.12], [9.6, 0.4], [9.62, 1.25], [9.5, 1.62], [9.2, 1.82], [7.4, 1.82], [7.25, 1.72], [0, 1.72]]), MAT.body));
  const inlay = mesh(new THREE.TorusGeometry(8.35, 0.07, 12, 220), MAT.accent); inlay.rotation.x = Math.PI / 2; inlay.position.y = 1.83; g.add(inlay);
  const px = -7.0, pz = -1.2;
  // post foot flange
  const foot = mesh(lathe([[0, 0], [1.25, 0], [1.2, 0.35], [0.8, 0.7], [0.6, 1.0], [0, 1.0]], 64), MAT.body); foot.position.set(px, 1.8, pz); g.add(foot);
  const post = mesh(new THREE.CylinderGeometry(0.55, 0.58, 30, 48), MAT.body); post.position.set(px, 2.8 + 15, pz); g.add(post);
  // height collar + thumb screw
  const collar = mesh(lathe([[0, 0], [0.95, 0], [1.05, 0.15], [1.05, 2.0], [0.95, 2.15], [0, 2.15]], 64), MAT.body); collar.position.set(px, 21, pz); g.add(collar);
  const screw = new THREE.Group();
  const shaft = mesh(new THREE.CylinderGeometry(0.18, 0.18, 1.0, 16), MAT.accent); shaft.rotation.z = Math.PI / 2; shaft.position.x = 0.5; screw.add(shaft);
  const knob = mesh(lathe([[0, 0], [0.5, 0], [0.55, 0.1], [0.55, 0.65], [0.48, 0.75], [0, 0.75]], 48), MAT.accent); knob.rotation.z = -Math.PI / 2; knob.position.x = 1.0; screw.add(knob);
  screw.position.set(px, 22.05, pz); screw.rotation.y = -0.6; g.add(screw);
  // arm
  const top = new V3(px, 32.8, pz), shadeTop = new V3(0, 38.6, 0);
  const curve = new THREE.CubicBezierCurve3(top, new V3(px, 39.2, pz), new V3(-1.2, 39.6, 0), new V3(0, 38.6, 0));
  g.add(mesh(new THREE.TubeGeometry(curve, 160, 0.52, 32), MAT.body));
  const sock = mesh(lathe([[0, 0], [1.25, 0], [1.3, 0.2], [1.1, 1.2], [0.6, 1.6], [0, 1.6]], 64), MAT.accent); sock.position.set(0, 37.3, 0); g.add(sock);
  // shade: outer, inner, rolled lip
  const prof = []; for (let i = 0; i <= 48; i++) { const t = i / 48; prof.push([1.35 + 6.45 * Math.pow(t, 1.25), 37.4 - 6.6 * t + 0.9 * Math.sin(t * Math.PI) * (1 - t)]); }
  const shadeMat = MAT.body.clone(); shadeMat.side = THREE.DoubleSide;
  g.add(mesh(lathe(prof), shadeMat));
  const inner = mesh(lathe(prof.map(([x, y]) => [x * 0.985, y - 0.12])), MAT.shadeInner, { cast: false }); MAT.shadeInner.side = THREE.DoubleSide; g.add(inner);
  const lip = mesh(new THREE.TorusGeometry(7.82, 0.16, 16, 220), MAT.accent); lip.rotation.x = Math.PI / 2; lip.position.y = 30.8; g.add(lip);
  // GU10 bulb: housing + glowing lens + reflector ring
  const housing = mesh(new THREE.CylinderGeometry(1.75, 1.75, 2.2, 48), new THREE.MeshStandardMaterial({ color: 0x9a9a9a, metalness: 1, roughness: 0.25 }), { cast: false }); housing.position.y = 35.4; g.add(housing);
  const lens = mesh(new THREE.CircleGeometry(1.55, 64), MAT.lens, { cast: false }); lens.rotation.x = Math.PI / 2; lens.position.y = 34.28; g.add(lens);
  const refl = mesh(new THREE.TorusGeometry(1.62, 0.1, 12, 64), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.1 }), { cast: false }); refl.rotation.x = Math.PI / 2; refl.position.y = 34.3; g.add(refl);
  // lights
  const spot = new THREE.SpotLight(0xffb468, +(P.get('spot') || (finish === 'dorado' ? 3800 : 5200)), 140, 0.66, 0.95, 2);
  spot.position.set(0, 34.1, 0); spot.target.position.set(0, 0, 0);
  spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.radius = 10; spot.shadow.blurSamples = 20; spot.shadow.bias = -0.0005; spot.shadow.camera.near = 1;
  g.add(spot, spot.target);
  const innerGlow = new THREE.PointLight(0xffc27a, 60, 9, 2); innerGlow.position.set(0, 33.6, 0); g.add(innerGlow);
  return g;
}

// ---------------- candle ----------------
function buildCandle(scent = 'Ámbar Noir', labelRot = 0) {
  const g = new THREE.Group(); g.name = 'candle';
  const jarProf = [[0, 0], [4.42, 0], [4.58, 0.12], [4.62, 0.4], [4.62, 9.55], [4.58, 9.82], [4.47, 9.9], [4.36, 9.82], [4.33, 9.55], [4.33, 0.85], [0, 0.85]];
  const jar = mesh(lathe(jarProf), MAT.glass, { cast: false, receive: false }); g.add(jar);
  { const _m = mesh(new THREE.CylinderGeometry(4.3, 4.3, 6.75, 160, 1, true), MAT.wax, { cast: false }); _m.position.y = 0.86 + 3.375; g.add(_m); }
  // melt pool: shallow dish meeting the wall with a meniscus
  const pool = []; for (let i = 0; i <= 32; i++) { const t = i / 32; pool.push([4.3 * t, 7.48 + 0.12 * t * t + (t > 0.94 ? (t - 0.94) * 1.6 : 0)]); }
  g.add(mesh(lathe(pool.reverse()), MAT.pool, { cast: false }));
  const men = mesh(new THREE.TorusGeometry(4.24, 0.07, 10, 160), MAT.meniscus, { cast: false }); men.rotation.x = Math.PI / 2; men.position.y = 7.6; g.add(men);
  const wick = new THREE.CatmullRomCurve3([new V3(0, 7.4, 0), new V3(0.02, 7.9, 0), new V3(0.12, 8.3, 0.04), new V3(0.26, 8.55, 0.08)]);
  g.add(mesh(new THREE.TubeGeometry(wick, 24, 0.07, 10), MAT.wick, { cast: false }));
  const label = mesh(new THREE.CylinderGeometry(4.64, 4.64, 4.4, 160, 1, true, -0.95, 1.9), new THREE.MeshStandardMaterial({ map: paperLabel(scent), roughness: 0.85 }), { cast: false });
  label.position.y = 4.3; label.rotation.y = labelRot; g.add(label);
  return g;
}

// ---------------- props ----------------
function buildCord(points, dimmerAt = 0.45) {
  const g = new THREE.Group(); g.name = 'cord';
  const c = new THREE.CatmullRomCurve3(points.map(p => new V3(...p)));
  g.add(mesh(new THREE.TubeGeometry(c, 300, 0.32, 16), MAT.rubber));
  const p = c.getPointAt(dimmerAt), t = c.getTangentAt(dimmerAt);
  const dim = new THREE.Group();
  dim.add(mesh(new RoundedBoxGeometry(6.2, 1.8, 2.8, 4, 0.7), MAT.rubber));
  const dial = mesh(lathe([[0, 0], [0.95, 0], [1.0, 0.15], [1.0, 0.75], [0.9, 0.85], [0, 0.85]], 48), MAT.brassPolished); dial.position.set(0.8, 0.85, 0); dim.add(dial);
  const dot = mesh(new THREE.CircleGeometry(0.16, 16), new THREE.MeshStandardMaterial({ color: 0xffc070, emissive: 0xffa040, emissiveIntensity: 2 })); dot.rotation.x = -Math.PI / 2; dot.position.set(-1.8, 0.91, 0); dim.add(dot);
  dim.position.copy(p); dim.position.y = 0.9; dim.rotation.y = Math.atan2(-t.z, t.x); g.add(dim);
  return g;
}
function board(w = 86, d = 46) { const W2 = 320, D2 = 120; const m = mesh(new RoundedBoxGeometry(W2, 3.4, D2, 6, 0.7), MAT.wood); m.position.set(0, -1.7, -(d / 2 + 2) + D2 / 2); return m; }
for (const k of ['map', 'roughnessMap', 'bumpMap']) WOOD[k].repeat.set(2.2, 1.4);
function cyclorama(color = 0x1b1713) {
  const prof = [], R = 70, back = -70, front = 260, top = 320;
  for (let i = 0; i <= 40; i++) prof.push([front - (front - (back + R)) * i / 40, -3.4]);
  for (let i = 1; i <= 40; i++) { const a = i / 40 * Math.PI / 2; prof.push([back + R - Math.sin(a) * R, -3.4 + R - Math.cos(a) * R]); }
  for (let i = 1; i <= 20; i++) prof.push([back, -3.4 + R + (top - R) * i / 20]);
  const geo = new THREE.BufferGeometry(), pos = [], idx = [], wd = 1400;
  prof.forEach(([z, y]) => { pos.push(-wd / 2, y, z, wd / 2, y, z); });
  for (let i = 0; i < prof.length - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  const m = mesh(geo, new THREE.MeshStandardMaterial({ color, roughness: 0.92 }), { cast: false }); m.material.side = THREE.DoubleSide; return m;
}
function book(w, h, d, cover) {
  const g = new THREE.Group();
  g.add(mesh(new RoundedBoxGeometry(w, h, d, 3, 0.18), new THREE.MeshPhysicalMaterial({ color: cover, roughness: 0.75, sheen: 0.3 })));
  const pages = mesh(new THREE.BoxGeometry(w - 0.5, h - 0.36, d - 0.25), new THREE.MeshStandardMaterial({ color: 0xe8dfcc, roughness: 0.9 })); pages.position.x = 0.3; g.add(pages);
  const band = mesh(new THREE.BoxGeometry(0.05, h * 1.002, 1.2), MAT.brassPolished); band.position.set(-w / 2 - 0.01, 0, d * 0.25); g.add(band);
  return g;
}
function waxTray(color, name) {
  const g = new THREE.Group(); g.name = 'wax';
  const m = new THREE.MeshPhysicalMaterial({ color, roughness: 0.48, sheen: 0.7, sheenColor: new THREE.Color(0xffffff), clearcoat: 0.15, clearcoatRoughness: 0.5 });
  for (let i = 0; i < 6; i++) { const c = mesh(new RoundedBoxGeometry(2.7, 1.7, 2.7, 5, 0.5), m); c.position.set((i % 3 - 1) * 2.95, 0.85 + 0.3, (Math.floor(i / 3) - 0.5) * 2.95); g.add(c); }
  const card = mesh(new RoundedBoxGeometry(10.2, 0.3, 11.2, 2, 0.1), new THREE.MeshStandardMaterial({ color: 0x0e0d0b, roughness: 0.7 })); card.position.set(0, 0.15, 1.6); g.add(card);
  const lbl = mesh(new THREE.PlaneGeometry(8.6, 3.0), new THREE.MeshStandardMaterial({ map: cardTex('Velaroma', name), roughness: 0.6 }), { cast: false });
  lbl.rotation.x = -Math.PI / 2; lbl.position.set(0, 0.31, 5.3); g.add(lbl);
  return g;
}
function giftBox() {
  const g = new THREE.Group(); g.name = 'box';
  const soft = new THREE.MeshPhysicalMaterial({ color: 0x121110, roughness: 0.78, sheen: 0.35, sheenColor: new THREE.Color(0x40362a), bumpMap: SPECK, bumpScale: 0.1 });
  { const _m = mesh(new RoundedBoxGeometry(24, 10.2, 18, 4, 0.25), soft); _m.position.y = 5.1; g.add(_m); }
  { const _m = mesh(new RoundedBoxGeometry(24.6, 3.4, 18.6, 4, 0.3), soft); _m.position.y = 10.6; g.add(_m); }
  const rib = new THREE.MeshPhysicalMaterial({ color: 0xc19a55, metalness: 0.3, roughness: 0.38, sheen: 1, sheenColor: new THREE.Color(0xffe3a8), sheenRoughness: 0.35 });
  { const _m = mesh(new THREE.BoxGeometry(24.8, 12.45, 1.8), rib); _m.position.y = 6.2; g.add(_m); }
  { const _m = mesh(new THREE.BoxGeometry(1.8, 12.45, 18.8), rib); _m.position.y = 6.2; g.add(_m); }
  for (const s of [-1, 1]) {

// ---------------- backdrop (out-of-focus wall lit by a warm pool of light) ----------------

    r.addColorStop(0.7, `rgba(34,22,14,${0.6 * strength})`); r.addColorStop(1, 'rgba(13,11,9,0)');

// ---------------- camera framing ----------------

function frame(objs, dir, { fillX = 0.84, fillY = 0.84, cx = 0, cy = 0 } = {}) {
  const box = new THREE.Box3(); objs.forEach(o => { o.updateMatrixWorld(true); box.expandByObject(o); });
  const c = box.getCenter(new V3());
  const corners = []; for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners.push(new V3(x, y, z));
