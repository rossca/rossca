<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const shot = P.get('shot') || 'lamp-negro';
const W = +P.get('w') || 1600, H = +P.get('h') || 1600;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = +P.get('exp') || 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// ---------- textures ----------
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

const woodTex = canvasTex(2048, 1024, (g, w, h) => {
  const r = rand(7);
  g.fillStyle = '#2a1a10'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    const y = r() * h, a = 0.04 + r() * 0.08;
    g.strokeStyle = r() > 0.5 ? `rgba(90,55,30,${a})` : `rgba(10,5,2,${a})`;
    g.lineWidth = 1 + r() * 3;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= w; x += 64) g.lineTo(x, y + Math.sin(x / 180 + i) * 6 + (r() - 0.5) * 3);
    g.stroke();
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(2, 2);

const plasterTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rand(3);
  g.fillStyle = '#1b1712'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40000; i++) {
    g.fillStyle = `rgba(${r() > 0.5 ? '255,240,220' : '0,0,0'},${r() * 0.035})`;
    g.fillRect(r() * w, r() * h, 2 + r() * 3, 2 + r() * 3);
  }
});
plasterTex.wrapS = plasterTex.wrapT = THREE.RepeatWrapping; plasterTex.repeat.set(3, 3);

const brushedRough = canvasTex(512, 512, (g, w, h) => {
  const r = rand(11);
  g.fillStyle = '#6a6a6a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { const v = 80 + r() * 90 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(0, r() * h, w, 1); }
}, false);

function labelTex(text, sub, bg = '#0e0d0b') {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#c9a45c'; g.lineWidth = 6; g.strokeRect(40, 40, w - 80, h - 80);
    g.fillStyle = '#d8b56c'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 120px Georgia, "Times New Roman", serif';
    g.fillText(text, w / 2, h / 2 - (sub ? 30 : 0));
    if (sub) { g.font = '300 44px Helvetica, Arial, sans-serif'; g.fillText(sub, w / 2, h / 2 + 90); }
  });
}

// ---------- materials ----------
const finish = (shot.includes('dorado') || P.get('finish') === 'dorado') ? 'dorado' : 'negro';
const metal = finish === 'dorado'
  ? new THREE.MeshPhysicalMaterial({ color: 0xc9a25a, metalness: 1, roughness: 0.42 })
  : new THREE.MeshPhysicalMaterial({ color: 0x141312, metalness: 0.6, roughness: 0.55, clearcoat: 0.3, clearcoatRoughness: 0.4 });
const goldAccent = new THREE.MeshPhysicalMaterial({ color: 0xd2ab62, metalness: 1, roughness: 0.25 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.6, ior: 1.5, transparent: true, opacity: 1, specularIntensity: 1, envMapIntensity: 1.5 });
const amberGlass = new THREE.MeshPhysicalMaterial({ color: 0xfff1dc, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.22, clearcoat: 1, depthWrite: false, side: THREE.DoubleSide });

// ---------- builders ----------
function lamp(mat) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(8.5, 9, 1.6, 96), mat);
  base.position.y = 0.8; base.castShadow = base.receiveShadow = true; g.add(base);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(8.75, 0.12, 12, 96), goldAccent);
  ring.rotation.x = Math.PI / 2; ring.position.y = 1.62; if (finish === 'negro') g.add(ring);
  const postX = -6.8;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 32, 32), mat);
  post.position.set(postX, 17.5, 0); post.castShadow = true; g.add(post);
  const knob = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 1.4, 32), mat);
  knob.position.set(postX, 22, 0); g.add(knob);
  const knob2 = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.08, 8, 48), goldAccent);
  knob2.rotation.x = Math.PI / 2; knob2.position.set(postX, 22.7, 0); g.add(knob2);
  const curve = new THREE.CubicBezierCurve3(new THREE.Vector3(postX, 33, 0), new THREE.Vector3(postX, 37.5, 0), new THREE.Vector3(-3, 37.5, 0), new THREE.Vector3(0, 37.2, 0));
  const arm = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.55, 24), mat); arm.castShadow = true; g.add(arm);
  // shade (dome opening down)
  const pts = [];
  for (let i = 0; i <= 40; i++) { const t = i / 40; pts.push(new THREE.Vector2(1.2 + 6.3 * Math.sin(t * Math.PI / 2) ** 1.4, 6.5 * (1 - t))); }
  const shadeGeo = new THREE.LatheGeometry(pts, 128);
  const shadeMat = mat.clone(); shadeMat.side = THREE.DoubleSide;
  const shade = new THREE.Mesh(shadeGeo, shadeMat); shade.position.set(0, 30.5, 0); shade.castShadow = true; g.add(shade);
  const inner = new THREE.Mesh(shadeGeo, new THREE.MeshStandardMaterial({ color: 0xf3e2c0, roughness: 0.6, side: THREE.BackSide, emissive: 0x4a2a08, emissiveIntensity: 0.6 }));
  inner.scale.setScalar(0.985); inner.position.copy(shade.position); g.add(inner);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(7.5, 0.13, 12, 128), goldAccent);
  lip.rotation.x = Math.PI / 2; lip.position.set(0, 30.5, 0); g.add(lip);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffe2b0, emissive: 0xffb05a, emissiveIntensity: 9 }));
  bulb.position.set(0, 32.3, 0); g.add(bulb);
  const spot = new THREE.SpotLight(0xffb066, +(P.get('spot') || 11000), 120, 0.75, 0.85, 2);
  spot.position.set(0, 32.2, 0); spot.target.position.set(0, 0, 0);
  spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.bias = -0.0015; spot.shadow.normalBias = 0.05; spot.shadow.radius = 6;
  g.add(spot, spot.target);
  const glow = new THREE.PointLight(0xffa850, 900, 60, 2); glow.position.set(0, 29, 2); g.add(glow);
  return g;
}

function candle(scale = 1, wax = 0xd9c4a2) {
  const g = new THREE.Group();
  const jar = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 9.5, 96, 1, true), amberGlass);
  jar.position.y = 4.75; jar.castShadow = false; g.add(jar);
  const bottom = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 4.6, 0.6, 96), new THREE.MeshStandardMaterial({ color: 0xcdb89a, roughness: 0.4 })); bottom.position.y = 0.3; g.add(bottom);
  const waxM = new THREE.Mesh(new THREE.CylinderGeometry(4.45, 4.45, 7, 96), new THREE.MeshStandardMaterial({ color: wax, roughness: 0.8 }));
  waxM.position.y = 4.16; g.add(waxM);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(4.28, 96), new THREE.MeshPhysicalMaterial({ color: 0xf0c890, roughness: 0.05, clearcoat: 1, transmission: 0.3, thickness: 0.5 }));
  pool.rotation.x = -Math.PI / 2; pool.position.y = 7.62; g.add(pool);
  const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.0, 8), new THREE.MeshStandardMaterial({ color: 0x1a120a, roughness: 1 }));
  wick.position.y = 8.0; g.add(wick);
  const label = new THREE.Mesh(new THREE.CylinderGeometry(4.65, 4.65, 3.2, 96, 1, true, -0.9, 1.8), new THREE.MeshStandardMaterial({ map: labelTex('VELAROMA', 'ÁMBAR NOIR', '#f3ede2'), roughness: 0.7, transparent: true }));
  label.position.y = 4.6; label.rotation.y = +(P.get('lr') || 0.34); g.add(label);
  g.scale.setScalar(scale);
  return g;
}

function giftBox() {
  const g = new THREE.Group();
  const boxMat = new THREE.MeshPhysicalMaterial({ color: 0x0f0e0d, roughness: 0.75, sheen: 0.3 });
  const body = new THREE.Mesh(new RoundedBoxGeometry(24, 10, 18, 4, 0.3), boxMat); body.position.y = 5; body.castShadow = body.receiveShadow = true; g.add(body);
  const lid = new THREE.Mesh(new RoundedBoxGeometry(24.8, 3.2, 18.8, 4, 0.3), boxMat); lid.position.y = 10.4; lid.castShadow = true; g.add(lid);
  const ribbonMat = new THREE.MeshPhysicalMaterial({ color: 0xc9a45c, metalness: 0.6, roughness: 0.35, sheen: 1, sheenColor: new THREE.Color(0xffe0a0) });
  const r1 = new THREE.Mesh(new THREE.BoxGeometry(25.0, 13.3, 1.6), ribbonMat); r1.position.set(0, 6.6, 0); g.add(r1);
  const r2 = new THREE.Mesh(new THREE.BoxGeometry(1.6, 13.3, 19.0), ribbonMat); r2.position.set(0, 6.6, 0); g.add(r2);
  for (const s of [-1, 1]) {
    const bow = new THREE.Mesh(new THREE.TorusGeometry(2.4, 0.55, 16, 48), ribbonMat);
    bow.scale.set(1.3, 0.55, 1); bow.rotation.set(Math.PI / 2, 0, s * 0.5); bow.position.set(s * 2.6, 12.4, 0); g.add(bow);
  }
  const knot = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 24), ribbonMat); knot.scale.y = 0.6; knot.position.set(0, 12.2, 0); g.add(knot);
  const tag = new THREE.Mesh(new THREE.PlaneGeometry(9, 4.5), new THREE.MeshStandardMaterial({ map: labelTex('Velaroma', 'COLECCIÓN LUMIÈRE'), roughness: 0.6 }));
  tag.position.set(-6.5, 5.5, 9.02); g.add(tag);
  return g;
}

function waxBar(color, name) {
  const g = new THREE.Group();
  const m = new THREE.MeshPhysicalMaterial({ color, roughness: 0.5, sheen: 0.6, sheenColor: new THREE.Color(0xffffff), transmission: 0.12, thickness: 1.5 });
  for (let i = 0; i < 6; i++) {
    const c = new THREE.Mesh(new RoundedBoxGeometry(2.6, 1.6, 2.6, 4, 0.45), m);
    c.position.set((i % 3 - 1) * 2.9, 0.8, (Math.floor(i / 3) - 0.5) * 2.9); c.castShadow = c.receiveShadow = true; g.add(c);
  }
  const card = new THREE.Mesh(new RoundedBoxGeometry(10, 0.3, 7.4, 2, 0.1), new THREE.MeshStandardMaterial({ color: 0x0e0d0b, roughness: 0.7 }));
  card.position.y = -0.15; card.receiveShadow = true; g.add(card);
  const lbl = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 4.25), new THREE.MeshStandardMaterial({ map: labelTex('Velaroma', name), roughness: 0.6 }));
  lbl.rotation.x = -Math.PI / 2; lbl.position.set(0, 0.01, 6.4); g.add(lbl);
  return g;
}

function room({ wood = true, wallColor = 0xffffff } = {}) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), wood
    ? new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.25 })
    : new THREE.MeshStandardMaterial({ color: 0x15130f, roughness: 0.85 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(600, 300), new THREE.MeshStandardMaterial({ map: plasterTex, color: wallColor, roughness: 0.95 }));
  wall.position.set(0, 100, -45); wall.receiveShadow = true; scene.add(wall);
}
function halo(x, y, power = 1) {
  const l = new THREE.PointLight(0xff9d4d, 1800 * power, 70, 1.6); l.position.set(x, y, -35); scene.add(l);
}

function fill(intensity = 1) {
  const key = new THREE.DirectionalLight(0xffe9d0, 0.35 * intensity); key.position.set(-40, 50, 60); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffc89a, 0.6 * intensity); rim.position.set(50, 40, -60); scene.add(rim);
  scene.add(new THREE.HemisphereLight(0x3a2c20, 0x0a0806, 0.25 * intensity));
}

const camera = new THREE.PerspectiveCamera(+P.get('fov') || 30, W / H, 0.5, 2000);

// ---------- shots ----------
if (shot.startsWith('lamp')) {
  room(); fill();
  scene.add(lamp(metal));
  const c = candle(); c.position.set(0, 1.66, 0); scene.add(c);
  halo(0, 30);
  camera.position.set(28, 30, 80); camera.lookAt(-1.5, 17, 0);
}
if (shot === 'pack') {
  room(); fill(1.1);
  const l = lamp(metal); l.position.set(-10, 0, -4); scene.add(l);
  const c = candle(); c.position.set(-10, 1.66, -4); scene.add(c);
  const b = giftBox(); b.position.set(16, 0, 4); b.rotation.y = -0.45; scene.add(b);
  const colors = [[0xd39a4a, 'ÁMBAR NOIR'], [0x8f5d6e, 'HIGO & CACHEMIR'], [0xf1e3c4, 'VAINILLA']];
  colors.forEach(([col, n], i) => { const w = waxBar(col, n); w.position.set(-8 + i * 11.5, 0, 20 + (i === 1 ? 2 : 0)); w.rotation.y = (i - 1) * 0.12; scene.add(w); });
  halo(-10, 30);
  camera.position.set(18, 44, 122); camera.lookAt(4, 11, 4);
}
if (shot === 'wax') {
  room(); fill(1.6);
  const spot = new THREE.SpotLight(0xffc78a, 7000, 120, 0.5, 0.8, 2); spot.position.set(-10, 60, 25); spot.castShadow = true; spot.shadow.mapSize.set(2048, 2048); spot.shadow.radius = 6; scene.add(spot);
  const colors = [[0xd39a4a, 'ÁMBAR NOIR'], [0x8f5d6e, 'HIGO & CACHEMIR'], [0xf1e3c4, 'VAINILLA']];
  colors.forEach(([col, n], i) => { const w = waxBar(col, n); w.position.set(-11.5 + i * 11.5, 0, (i === 1 ? -3 : 0)); w.rotation.y = (i - 1) * -0.15; scene.add(w); });
  camera.fov = 24; camera.updateProjectionMatrix(); camera.position.set(0, 60, 68); camera.lookAt(0, 0, 3);
}
if (shot === 'hero') {
  room(); fill(0.7);
  const l = lamp(metal); l.position.set(18, 0, 0); scene.add(l);
  const c = candle(); c.position.set(18, 1.66, 0); scene.add(c);
  const c2 = candle(0.7, 0xe8d6b8); c2.position.set(31, 0, -10); scene.add(c2);
  const w = waxBar(0xd39a4a, 'ÁMBAR NOIR'); w.position.set(4, 0, 16); w.rotation.y = 0.35; scene.add(w);
  halo(18, 32, 1.4);
  camera.position.set(0, 22, 82); camera.lookAt(-1, 17, 0);
}
if (shot === 'detail') {
  room(); fill(0.6);
  scene.add(lamp(metal));
  const c = candle(); c.position.set(0, 1.66, 0); scene.add(c);
  camera.fov = 40; camera.updateProjectionMatrix(); camera.position.set(18, 27, 36); camera.lookAt(0, 16, 0);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), (+P.get('bloom') || (finish === 'dorado' ? 0.28 : 0.55)), 0.6, (finish === 'dorado' ? 0.95 : 0.85)));
composer.addPass(new OutputPass());
composer.render();
window.__out = renderer.domElement.toDataURL('image/png');
window.__done = true;
</script></body></html>
